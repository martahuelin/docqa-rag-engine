[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.1.0"
description = "Ask your documents: question answering over a document collection (LangChain + Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-ollama",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
test = ["pytest"]

[tool.setuptools]
packages = ["docqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a reachable Ollama server with the models pulled"]
